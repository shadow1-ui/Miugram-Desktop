name: Miugram Windows identity static checks
on:
  push:
    branches: ['miugram/bootstrap']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 miugram/tests/check_windows_identity.py
      - run: python3 miugram/tests/check_theme.py
      - run: python3 miugram/tests/check_profile_background.py
      - run: python3 miugram/tests/check_message_checks.py
      - name: Test ghost policy state combinations
        run: |
          g++ -std=c++17 -I. miugram/tests/ghost_policy_test.cpp -o /tmp/miugram-ghost-test
          /tmp/miugram-ghost-test
      - name: Test automatic profile framing
        run: |
          g++ -std=c++17 -I. miugram/tests/auto_frame_test.cpp -o /tmp/miugram-frame-test
          /tmp/miugram-frame-test
